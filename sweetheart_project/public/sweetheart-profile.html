<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sweetheart - Profile</title>
  <link rel="stylesheet" href="styles/shstyle.css">
</head>
<body>

  <nav>
    <a href="sweetheart-register.html">Register</a>
    <a href="sweetheart-login.html">Login</a>
    <a href="sweetheart-confess.html">Confess</a>
    <a href="sweetheart-note.html">LoveNotes</a>
    <span id="userWelcome" style="margin-left: auto; color: var(--primary); font-weight: 600; display: none;">Hi, <span id="userNameDisplay"></span>!</span>
    <a href="#" id="logoutBtn" style="display: none; font-size: 14px; opacity: 0.8;">Logout</a>
  </nav>

  <div class="container">
    <div class="content">
      <h1>Your Profile ❤️</h1>
      <form id="profileForm">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="First Name" required>
        
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Last Name" required>
        
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Username" required>
        
        <button type="submit">Update Profile</button>
      </form>
      <hr>
      <button id="deleteAccountBtn" style="background: none; color: #e74c3c; border: 1px solid #e74c3c; font-size: 14px;">Delete Account</button>
    </div>
  </div>

  <script src="scripts/auth.js"></script>
  <script src="scripts/profile.js"></script>
</body>
</html>
